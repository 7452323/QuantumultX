# 黄豆短剧 lzlukvca 金币+会员剧集解锁 —— Quantumult X 远程 rewrite 配置
# ============================================================
# 使用方法（无需下载任何文件）：
#   在 Quantumult X 主配置 [rewrite_remote] 段加入下面一行：
#
#   [rewrite_remote]
#   https://raw.githubusercontent.com/7452323/QuantumultX/main/script/pornography/lzlukvca.conf, tag=黄豆短剧解锁, update-interval=86400, opt-parser=false, enabled=true
#
#   然后在 [mitm] 段加入 hostname（远程配置只加载 rewrite 规则，MitM 域名需在主配置）：
#
#   [mitm]
#   hostname = lzlukvca.cc
#
#   开启 MitM 并安装/信任证书后，打开 App 即可。
# ============================================================

[rewrite_local]
^https://lzlukvca\.cc/api/(drama/(detail|play|doBuy)|user/(info|recharge)) url script-request-body https://raw.githubusercontent.com/7452323/QuantumultX/main/script/pornography/lzlukvca.js
^https://lzlukvca\.cc/api/(drama/(detail|play|doBuy)|user/(info|recharge)) url script-response-body https://raw.githubusercontent.com/7452323/QuantumultX/main/script/pornography/lzlukvca.js

[mitm]

hostname = lzlukvca.cc
