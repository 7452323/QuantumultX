; 小红书视频去水印 —— Quantumult X
; 笔记页响应改写：把烧了水印的转码流换成无水印原视频
;
; 用法：设置 → 重写 → 引用，添加下面这行远程重写：
;   https://raw.githubusercontent.com/7452323/QuantumultX/main/script/XiaohongshuVideo.conf
; 需开启 MITM 并信任证书。
;
; 原理：笔记页 __INITIAL_STATE__ 里 video.consumer.originVideoKey 是原片 key，
; 而 media.stream 的 masterUrl/backupUrls 是 720p 且烧了「小红书」水印+昵称的转码流。
; Post Saver 这类工具直接抓 masterUrl 下载，所以存下来带水印。
; 本脚本把响应体里所有 .mp4 链接换成 https://sns-video-bd.xhscdn.com/<originVideoKey>。

[rewrite_local]
^https?:\/\/www\.xiaohongshu\.com\/(?:discovery\/item|explore)\/.*$ url script-response-body https://raw.githubusercontent.com/7452323/QuantumultX/main/script/XiaohongshuVideo.js

[mitm]
hostname = www.xiaohongshu.com
