; 小红书去水印（图片 + 视频）—— Quantumult X
; 笔记页响应改写：图片换成原图、视频换成无水印原片
;
; 用法：设置 → 重写 → 引用，添加下面这行远程重写：
;   https://raw.githubusercontent.com/7452323/QuantumultX/main/script/XiaohongshuVideo.conf
; 需开启 MITM 并信任证书。
;
; 原理：
;   imageList[].url 是 sns-webpic-qc.xhscdn.com/<日期>/<hash>/<fileId>!h5_1080jpg，带水印
;   imageList[].fileId -> https://sns-img-bd.xhscdn.com/<fileId> 无水印原图
;   video.consumer.originVideoKey -> https://sns-video-{qc,hw,bd}.xhscdn.com/<key> 无水印 1080p
;   media.stream 的 masterUrl 是 720p 且烧了水印+昵称的转码流
; 三台视频 CDN 字节完全相同（md5 一致），但 bd 实测只有 0.4-2.5MB/s、qc/hw 20MB+/s，
; 8.3MB 的原片喂不上就卡，所以写进 masterUrl/backupUrls 轮换，播放器可自行回退。

[rewrite_local]
^https?:\\/\\/www\\.xiaohongshu\\.com\\/(?:discovery\\/item|explore)\\/.*$ url script-response-body https://raw.githubusercontent.com/7452323/QuantumultX/main/script/XiaohongshuVideo.js

[mitm]
hostname = www.xiaohongshu.com
