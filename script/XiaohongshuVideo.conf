; 小红书去水印（图片 + 视频）—— Quantumult X
;
; 用法：设置 → 重写 → 引用，添加下面这行远程重写：
;   https://raw.githubusercontent.com/7452323/QuantumultX/main/script/XiaohongshuVideo.conf
; 需开启 MITM 并信任证书。
;
; 图片走 302：imageList[].url 是 sns-webpic-qc/<日期>/<hash>/<fileId>!h5_1080jpg，
;   页面的 JS 依赖这个形态渲染，在响应体里改会整片空白。所以在 HTTP 层重定向到
;   sns-img-bd/<fileId> 原图，页面体保持原样。
; 视频走响应体：video.consumer.originVideoKey -> sns-video-{qc,hw}.xhscdn.com/<key> 无水印 1080p；
;   media.stream 的 masterUrl 是 720p 且烧了水印+昵称的转码流。
;   三台 CDN 字节完全相同（md5 一致），但 bd 只有 0.4-2.5MB/s、qc/hw 20MB+/s，8.3MB 原片喂不上就卡。
; 原片响应头：有的 key 被 CDN 标成 application/octet-stream，播放器当"链接已过期"处理，
;   用 XiaohongshuVideoType.js 把这一类响应头改成 video/mp4（webp 封面、mp4 转码流不动）。

[filter_local]
; 图片 CDN 走 QUIC 会绕过 MITM，重定向就不生效
AND,((protocol,quic),(domain,sns-webpic-qc.xhscdn.com)),reject

[rewrite_local]
; sns-webpic-qc/<日期>/<hash>/<fileId>!h5_1080jpg → sns-img-bd/<fileId>
^https?:\/\/sns-webpic[a-z0-9\-]*\.xhscdn\.com\/(?:[^\/?#]+\/)+([^\/!?#]+)!h5_1080(?:jpg|webp)(?:\?.*)?$ url 302 https://sns-img-bd.xhscdn.com/$1
; 笔记页响应体改写（视频）
^https?:\/\/www\.xiaohongshu\.com\/(?:discovery\/item|explore)\/.*$ url script-response-body https://raw.githubusercontent.com/7452323/QuantumultX/main/script/XiaohongshuVideo.js
; 视频 CDN 响应头修正
^https?:\/\/sns-video-[a-z0-9\-]+\.xhscdn\.com\/.*$ url script-response-header https://raw.githubusercontent.com/7452323/QuantumultX/main/script/XiaohongshuVideoType.js

[mitm]
hostname = www.xiaohongshu.com, sns-webpic-qc.xhscdn.com, sns-webpic.xhscdn.com, sns-video-qc.xhscdn.com, sns-video-hw.xhscdn.com, sns-video-bd.xhscdn.com
