; 推特 / Instagram 受限内容修复 —— Quantumult X
; 用法：设置 → 重写 → 引用，添加：
;   https://raw.githubusercontent.com/7452323/QuantumultX/main/script/RestrictedMedia.conf
; 需开启 MITM 并信任证书。
; 推特无需任何配置；Instagram 受限视频需在 InstagramRestricted.js 顶部填 SESSION

[filter_local]
; QUIC 会绕过 MITM
AND,((protocol,quic),(domain,cdn.syndication.twimg.com)),reject
AND,((protocol,quic),(domain,www.instagram.com)),reject

[rewrite_local]
; 推特：syndication 返回 TweetTombstone 时用 fxtwitter 重建
^https:\/\/cdn\.syndication\.twimg\.com\/tweet-result.*$ url script-response-body https://raw.githubusercontent.com/7452323/QuantumultX/main/script/TwitterRestricted.js
; Instagram：embed 被判 invalid 时用登录会话重取，再以主站 og 兜底
^https:\/\/www\.instagram\.com\/.*\/embed\/.*$ url script-response-body https://raw.githubusercontent.com/7452323/QuantumultX/main/script/InstagramRestricted.js

[mitm]
hostname = cdn.syndication.twimg.com, www.instagram.com
