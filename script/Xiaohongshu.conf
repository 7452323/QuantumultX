; 小红书图片无水印原图 —— Quantumult X
; 把图片请求 302 到原图源 sns-img-bd，保存/下载即无水印
;
; 用法：设置 → 重写 → 引用，添加下面这行远程重写：
;   https://raw.githubusercontent.com/7452323/QuantumultX/main/script/Xiaohongshu.conf
; 需开启 MITM 并信任证书。
;
; 原理：小红书图片 URL 形如
;   sns-webpic-qc.xhscdn.com/<日期>/<哈希>/<原图ID>!nd_dft_wlteh_webp_3
; 后缀是带水印的压缩变体，取 <原图ID> 换到 sns-img-bd.xhscdn.com 即无水印原图。

[rewrite_local]
; 带后缀（!nd_dft_wlteh_webp_3 / !nd_whgt34_webp_wm_1 等）→ 原图
^https?:\/\/sns-webpic[a-z0-9\-]*\.xhscdn\.com\/(?:[^\/?#]+\/)+([^\/!?#]+)![^\/?#]*(\?.*)?$ url 302 https://sns-img-bd.xhscdn.com/$1
; 无后缀的 webpic 变体 → 原图
^https?:\/\/sns-webpic[a-z0-9\-]*\.xhscdn\.com\/(?:[^\/?#]+\/)+([^\/!?#]+)$ url 302 https://sns-img-bd.xhscdn.com/$1

[mitm]
hostname = sns-webpic-qc.xhscdn.com, sns-webpic.xhscdn.com, sns-webpic-bd.xhscdn.com, sns-webpic-hw.xhscdn.com
